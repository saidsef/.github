name: pre-commit

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    uses: saidsef/saidsef/.github/workflows/pre-commit.yaml@main

  auto-approve:
    uses: saidsef/saidsef/.github/workflows/auto-approve.yaml@main
    needs: [pre-commit]
    permissions:
      pull-requests: write
